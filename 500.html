<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0b0b0b">
<title>500 Something went wrong | PDFCompressInKB</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--fg:#f5f5f5;--muted:#a3a3a3;--line:#2a2a2a;--card:#111;--accent:#f5f5f5;--accent-fg:#0b0b0b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:22px 16px}
main{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:clamp(50px,12vh,110px)}
.brand{display:inline-flex;align-items:center;text-decoration:none;color:var(--fg)}
.brand img{display:block;width:min(230px,55vw);height:auto}
main section{width:100%;max-width:650px;margin:0 auto;text-align:center}
.code{font-size:clamp(64px,15vw,112px);font-weight:800;letter-spacing:-.07em;line-height:1;margin:0 0 22px;color:#ef4444}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.035em;margin:0 0 14px}
p{color:var(--muted);line-height:1.7;margin:0 auto;max-width:540px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
a.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:650;text-decoration:none}
a.secondary{border:1px solid var(--line);background:var(--card);color:var(--fg)}
a:focus-visible{outline:3px solid #f87171;outline-offset:4px}
footer{max-width:820px;width:100%;margin:60px auto 0;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
footer a{color:var(--fg);text-decoration:none;margin:0 8px}
@media(prefers-reduced-motion:no-preference){a.button{transition:transform .15s ease}a.button:hover{transform:translateY(-1px)}}
</style>
<link rel="stylesheet" href="/assets/site-design.css?v=1">
</head>
<body>
<main>
<header><a class="brand" href="/" aria-label="PDFCompressInKB home"><img src="/assets/logo.svg" alt="PDFCompressInKB" width="230" height="53"></a></header>
<section aria-labelledby="error-title">
<p class="code" aria-label="Error 500">500</p>
<h1 id="error-title">We hit an unexpected error</h1>
<p>Something went wrong on our side. Please try again in a little while, or return to the homepage.</p>
<div class="actions"><a class="button" href="/">Back to homepage</a><a class="button secondary" href="/#tool">Open PDF compressor</a></div>
</section>
<footer><strong>PDFCompressInKB</strong><p>Free browser-based PDF compression to a target KB or MB size.</p><nav aria-label="Helpful links"><a href="/">Home</a><a href="/about/">About</a><a href="/contact/">Contact</a><a href="/privacy-policy/">Privacy</a></nav></footer>
</main>
</body>
</html>
