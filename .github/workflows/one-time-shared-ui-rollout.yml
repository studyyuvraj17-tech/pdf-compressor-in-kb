name: One-time shared UI rollout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-shared-ui:
    if: "!contains(github.event.head_commit.message, '[ui-rollout]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add shared stylesheet to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              source = path.read_text(encoding='utf-8')
              if '/assets/site-design-system.css' in source:
                  continue
              marker = '</head>'
              if marker not in source.lower():
                  continue
              idx = source.lower().find(marker)
              link = '  <link rel="stylesheet" href="/assets/site-design-system.css?v=1">\n'
              source = source[:idx] + link + source[idx:]
              path.write_text(source, encoding='utf-8')
              changed.append(str(path))
          print(f'Updated {len(changed)} HTML pages')
          for name in changed:
              print(name)
          if not changed:
              raise SystemExit('No pages needed the shared stylesheet; refusing an empty rollout.')
          PY
      - name: Remove one-time workflow and commit rollout
        run: |
          rm .github/workflows/one-time-shared-ui-rollout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' .github/workflows/one-time-shared-ui-rollout.yml
          git commit -m "Apply shared UI stylesheet to all HTML pages [ui-rollout]"
          git push origin HEAD:main
