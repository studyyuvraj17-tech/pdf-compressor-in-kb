name: One-time FAQ update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-faq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update FAQ
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html.html')
          s = p.read_text(encoding='utf-8')
          old_q = 'Does compressing a PDF reduce quality?'
          new_q = 'How can I compress a PDF to 200KB without losing quality?'
          old_a = 'PDF compression can reduce image quality when a file needs substantial size reduction. This tool attempts to preserve quality first and only reduces it further when needed to approach the target.'
          new_a = 'You can compress a PDF to 200KB while preserving as much quality as possible by uploading your PDF, setting 200 KB as the target size, and clicking Compress. If a PDF requires a large reduction, some quality loss may be unavoidable.'
          if old_q not in s or old_a not in s:
              raise SystemExit('Target FAQ text not found')
          s = s.replace(old_q, new_q)
          s = s.replace(old_a, new_a)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit FAQ update and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html.html
          git rm .github/workflows/one-time-faq-update.yml
          git commit -m 'Update 200KB quality FAQ'
          git push
