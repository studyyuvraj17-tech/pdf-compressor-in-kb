name: Refresh shared UI on every page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-ui:
    if: "!contains(github.event.head_commit.message, '[ui-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump shared stylesheet cache version on all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              source = path.read_text(encoding='utf-8')
              updated = source.replace('/assets/site-design-system.css?v=1', '/assets/site-design-system.css?v=2')
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print(f'Updated stylesheet cache version on {len(changed)} HTML pages')
          if not changed:
              raise SystemExit('No versioned stylesheet links found; refusing an empty commit.')
          PY
      - name: Commit changes and remove this one-time workflow
        run: |
          rm .github/workflows/one-time-ui-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' .github/workflows/one-time-ui-refresh.yml
          git commit -m "Refresh shared UI styles across all pages [ui-refresh]"
          git push origin HEAD:main
