name: Apply shared UI stylesheet
on:
  push:
    branches:
      - design/unified-site-ui
    paths:
      - '.github/workflows/apply-shared-ui.yml'
      - 'assets/site-design-system.css'
permissions:
  contents: write
jobs:
  add-shared-stylesheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/unified-site-ui
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Link stylesheet on every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if '/assets/site-design-system.css' in text or not re.search(r'</head>', text, re.I):
                  continue
              text = re.sub(r'</head>', '<link rel="stylesheet" href="/assets/site-design-system.css?v=1">\n</head>', text, count=1, flags=re.I)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print(f'Updated {len(changed)} HTML pages')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Apply shared UI stylesheet to all pages"
            git push origin design/unified-site-ui
          fi
