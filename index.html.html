<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compress PDF to KB</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--line:#d6d3d1;--card:#fff;--accent:#1c1917;--accent-fg:#fafaf9;--ok:#15803d;--warn:#b45309;--err:#b91c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a09;--fg:#fafaf9;--muted:#a8a29e;--line:#44403c;--card:#1c1917;--accent:#fafaf9;--accent-fg:#0c0a09;--ok:#4ade80;--warn:#fbbf24;--err:#f87171}}
:root[data-theme="dark"]{--bg:#0c0a09;--fg:#fafaf9;--muted:#a8a29e;--line:#44403c;--card:#1c1917;--accent:#fafaf9;--accent-fg:#0c0a09;--ok:#4ade80;--warn:#fbbf24;--err:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:420px}
h1{font-size:20px;font-weight:600;margin:0 0 20px;letter-spacing:-.01em}
#drop{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--card);transition:border-color .15s}
#drop:hover,#drop.over{border-color:var(--fg)}
#drop b{color:var(--fg);font-weight:500;display:block;word-break:break-all}
#drop small{display:block;margin-top:4px}
input[type=file]{display:none}
.row{display:flex;gap:8px;margin-top:12px;align-items:center}
.num{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px}
.num input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:16px;padding:12px 0;outline:none}
.num span{color:var(--muted);font-size:14px}
button{font:inherit;font-size:15px;font-weight:500;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);padding:12px 20px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chips a{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;user-select:none}
.chips a:hover{color:var(--fg);border-color:var(--fg)}
#out{margin-top:20px;font-size:14px;min-height:20px;line-height:1.5}
#out .ok{color:var(--ok)}#out .warn{color:var(--warn)}#out .err{color:var(--err)}
#out small{display:block;color:var(--muted)}
#out a.dl{display:block;margin-top:10px;text-align:center;text-decoration:none;border-radius:10px;background:var(--accent);color:var(--accent-fg);padding:12px;font-weight:500}
#bar{height:3px;background:var(--line);border-radius:2px;margin-top:20px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
  <h1>Compress PDF to KB</h1>

  <label id="drop" for="file">
    <b id="fname">Choose or drop a PDF</b>
    <small id="fsize">Stays on your device</small>
  </label>
  <input type="file" id="file" accept="application/pdf">

  <div class="row">
    <div class="num"><input id="kb" type="number" min="10" value="200" inputmode="numeric" aria-label="Target size in KB"><span>KB</span></div>
    <button id="go" disabled>Compress</button>
  </div>
  <div class="chips" id="chips"><a>50</a><a>100</a><a>200</a><a>500</a><a>1000</a></div>

  <div id="bar"><i></i></div>
  <div id="out"></div>

  <footer>Quality is protected first. It only drops if your target can't be reached otherwise.</footer>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var file = null, busy = false, bytes = null;
  try { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch(e){}

  function fmt(b){ return b >= 1048576 ? (b/1048576).toFixed(2)+" MB" : Math.round(b/1024)+" KB"; }
  function say(h){ $("out").innerHTML = h; }
  function progress(p){ var b=$("bar"); b.style.display = p == null ? "none" : "block"; if(p != null) b.firstElementChild.style.width = Math.round(p*100)+"%"; }

  function setFile(f){
    if(!f) return;
    if(f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)){ say('<span class="err">That is not a PDF.</span>'); return; }
    file = f; $("fname").textContent = f.name; $("fsize").textContent = fmt(f.size);
    $("go").disabled = false; say("");
  }
  $("file").addEventListener("change", function(e){ setFile(e.target.files[0]); });
  var drop = $("drop");
  ["dragenter","dragover"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function(e){ setFile(e.dataTransfer.files[0]); });
  $("chips").addEventListener("click", function(e){ if(e.target.tagName === "A") $("kb").value = e.target.textContent; });

  function toBlob(canvas, q){ return new Promise(function(res){ canvas.toBlob(res, "image/jpeg", q); }); }

  async function renderPages(pdf, scale, onPage){
    var out = [];
    for(var i = 1; i <= pdf.numPages; i++){
      var page = await pdf.getPage(i);
      var vp = page.getViewport({scale: scale});
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext: ctx, viewport: vp}).promise;
      var base = page.getViewport({scale: 1});
      out.push({canvas: c, w: base.width, h: base.height});
      if(onPage) onPage(i);
    }
    return out;
  }
  function freePages(pages){ pages.forEach(function(p){ p.canvas.width = 0; p.canvas.height = 0; }); }

  async function sizeAt(pages, q){
    var total = 0, blobs = [];
    for(var i = 0; i < pages.length; i++){
      var b = await toBlob(pages[i].canvas, q);
      blobs.push(b); total += b.size + 600;
    }
    return {total: total + 1500, blobs: blobs};
  }

  async function build(pages, blobs){
    var doc = await PDFLib.PDFDocument.create();
    for(var i = 0; i < pages.length; i++){
      var img = await doc.embedJpg(await blobs[i].arrayBuffer());
      var pg = doc.addPage([pages[i].w, pages[i].h]);
      pg.drawImage(img, {x:0, y:0, width: pages[i].w, height: pages[i].h});
    }
    return new Blob([await doc.save()], {type: "application/pdf"});
  }

  // Try each scale (largest first); at each, find the best JPEG quality in [qMin,qMax] that fits.
  async function attempt(pdf, scales, qMin, qMax, target, progFrom, progTo){
    var lastTry = null;
    for(var s = 0; s < scales.length; s++){
      var pages = await renderPages(pdf, scales[s], function(i){
        progress(progFrom + ((s + i/pdf.numPages) / scales.length) * (progTo - progFrom));
      });
      var first = await sizeAt(pages, qMin);
      if(first.total > target){
        if(lastTry) freePages(lastTry.pages);
        lastTry = {pages: pages, blobs: first.blobs, fit: false};
        continue;
      }
      var lo = qMin, hi = qMax, fit = first;
      for(var k = 0; k < 5; k++){
        var mid = (lo + hi) / 2, r = await sizeAt(pages, mid);
        if(r.total <= target){ lo = mid; fit = r; } else { hi = mid; }
      }
      if(lastTry) freePages(lastTry.pages);
      return {pages: pages, blobs: fit.blobs, fit: true};
    }
    return lastTry;
  }

  async function run(){
    if(busy || !file) return;
    var target = Math.max(10, parseInt($("kb").value, 10) || 0) * 1024;
    if(file.size <= target){ say('<span class="ok">Already ' + fmt(file.size) + ', under your target.</span>'); return; }

    busy = true; $("go").disabled = true; say("Compressing…"); progress(0.03);
    var result = null, note = "", tone = "ok";
    try{
      bytes = await file.arrayBuffer();

      // Pass 0: lossless re-save (no quality loss, text stays selectable)
      try{
        var doc = await PDFLib.PDFDocument.load(bytes, {ignoreEncryption: true, updateMetadata: false});
        var lossless = new Blob([await doc.save({useObjectStreams: true})], {type: "application/pdf"});
        if(lossless.size <= target){
          result = lossless;
          note = "No quality loss. Text is still selectable.";
        }
      }catch(e){ /* fall through to image-based passes */ }

      if(!result){
        var pdf = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;

        // Pass 1: keep it sharp (high resolution, JPEG quality 75%+)
        progress(0.1);
        var best = await attempt(pdf, [2, 1.6, 1.3, 1.1], 0.75, 0.92, target, 0.1, 0.5);
        if(best && best.fit){
          result = await build(best.pages, best.blobs);
          note = "Quality kept high. Pages are now images, so text isn't selectable.";
          freePages(best.pages);
        } else {
          if(best) freePages(best.pages);
          // Pass 2: last resort, reduce quality to hit the target
          var rough = await attempt(pdf, [1, 0.8, 0.6, 0.45, 0.3, 0.2], 0.3, 0.85, target, 0.5, 0.92);
          result = await build(rough.pages, rough.blobs);
          freePages(rough.pages);
          note = rough.fit
            ? "Your target needed some quality loss. Try a slightly higher KB for a sharper file."
            : "Couldn't reach the target without heavy loss. This is the smallest possible.";
          tone = rough.fit ? "warn" : "err";
        }
      }

      progress(1);
      var hit = result.size <= target * 1.02;
      if(!hit && tone === "ok") tone = "warn";
      var url = URL.createObjectURL(result);
      var name = file.name.replace(/\.pdf$/i, "").replace(/"/g, "") + "-compressed.pdf";
      say('<span class="' + tone + '">' + fmt(file.size) + " → " + fmt(result.size) + "</span><small>" + note + "</small>" +
          '<a class="dl" href="' + url + '" download="' + name + '">Download</a>');
    }catch(err){
      console.error(err);
      say('<span class="err">Could not read this PDF. It may be password-protected or damaged.</span>');
    }
    setTimeout(function(){ progress(null); }, 500);
    busy = false; $("go").disabled = false;
  }
  $("go").addEventListener("click", run);
})();
</script>
</body>
</html>
